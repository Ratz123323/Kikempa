name: kikempa
description: Gestion des préférences alimentaires familiales

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  google_fonts: ^6.1.0
  uuid: ^4.2.1
  provider: ^6.1.1
  share_plus: ^12.0.2
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon_app.png"
  adaptive_icon_background: "#E8EAF0"
  adaptive_icon_foreground: "assets/icon_app.png"
